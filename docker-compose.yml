name: kafka-shop-demo

x-service: &service
  build: ./app
  image: kafka-shop-demo-app
  init: true
  restart: unless-stopped
  depends_on:
    kafka:
      condition: service_healthy
  environment: &service-env
    KAFKA_BROKERS: kafka:9092

services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: shop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  gateway:
    <<: *service
    command: ["node", "src/gateway/main.ts"]
    ports:
      - "3000:3000"
    volumes:
      # Lets you tweak the dashboard without rebuilding the image.
      - ./app/public:/app/public:ro

  inventory:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: inventory

  payment:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: payment

  shipping:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: shipping

  notification:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: notification

  analytics:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: analytics
